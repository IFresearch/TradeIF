# 数据源配置
data_sources:
  tushare:
    enabled: true
    token: "${TUSHARE_TOKEN}"  # 请填入您的tushare token 或使用环境变量 TUSHARE_TOKEN

# 数据库配置  
database:
  path: "data/stocks.db"  # SQLite数据库文件路径

# API配置
api:
  host: "127.0.0.1"
  port: 8000
  debug: true

# 回测配置
backtest:
  initial_capital: 100000  # 初始资金
  commission: 0.001  # 手续费率